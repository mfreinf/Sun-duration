<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SonnenVergleich">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>SonnenVergleich</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
  body { margin:0; padding:12px; background:#1a1c23; color:#fff; font-family:-apple-system,BlinkMacSystemFont,sans-serif; }
  .head { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:#aaa; margin-bottom:10px; }
  .card { background:#242731; border-radius:14px; padding:12px; margin-bottom:14px; }
  h2 { font-size:15px; margin:0 0 4px 0; }
  .sub { font-size:12px; color:#ccc; margin-bottom:8px; }
  .dot-b { color:#1f77b4; } .dot-o { color:#ff7f0e; }
  .chart-wrap { position:relative; height:235px; width:100%; }
</style>
</head>
<body>
<div class="head"><span>Sonnenstunden-Vergleich</span><span>Stand: 28.11.2026 11:05 Uhr</span></div>
<div class="card">
  <h2>Oberallgäu (DE)</h2>
  <div class="sub"><span class="dot-b">■</span> Messung (14d): <b>37.4 h</b> &nbsp;|&nbsp; <span class="dot-o">■</span> Vorhersage (7d): <b>44.8 h</b></div>
  <div class="chart-wrap"><canvas id="c1"></canvas></div>
</div>
<div class="card">
  <h2>Maspalomas (Gran Canaria)</h2>
  <div class="sub"><span class="dot-b">■</span> Satellit (14d): <b>140.6 h</b> &nbsp;|&nbsp; <span class="dot-o">■</span> Vorhersage (7d): <b>67.3 h</b></div>
  <div class="chart-wrap"><canvas id="c2"></canvas></div>
</div>
<script>
Chart.register(ChartDataLabels);
function mk(id, labels, data, colors) {
  new Chart(document.getElementById(id), {
    type: 'bar',
    data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, borderRadius: 4 }] },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: 18 } },
      plugins: {
        legend: { display: false },
        datalabels: {
          color: '#eee',
          anchor: 'end',
          align: 'end',
          offset: -2,
          font: { size: 9, weight: 'bold' },
          formatter: v => v > 0 ? v.toFixed(1) : ''
        },
        tooltip: { callbacks: { label: ctx => ctx.parsed.y + ' Std.' } }
      },
      scales: {
        x: { ticks: { color: '#bbb', font: { size: 10 } }, grid: { display: false } },
        y: { beginAtZero: true, max: 14.5, ticks: { color: '#bbb', callback: v => v + 'h' }, grid: { color: '#333' } }
      }
    }
  });
}
mk('c1', ["14.11.", "15.11.", "16.11.", "17.11.", "18.11.", "19.11.", "20.11.", "21.11.", "22.11.", "23.11.", "24.11.", "25.11.", "26.11.", "27.11.", "28.11.", "29.11.", "30.11.", "01.12.", "02.12.", "03.12.", "04.12."], [9.15, 4.12, 3.67, 0.78, 4.0, 0.0, 2.07, 0.0, 0.0, 0.78, 5.23, 0.85, 0.0, 6.7, 7.52, 6.43, 1.68, 5.08, 8.04, 8.0, 8.0], ["#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4", "#ff7f0e", "#ff7f0e", "#ff7f0e", "#ff7f0e", "#ff7f0e", "#ff7f0e", "#ff7f0e"]);
mk('c2', ["14.11.", "15.11.", "16.11.", "17.11.", "18.11.", "19.11.", "20.11.", "21.11.", "22.11.", "23.11.", "24.11.", "25.11.", "26.11.", "27.11.", "28.11.", "29.11.", "30.11.", "01.12.", "02.12.", "03.12.", "04.12."], [10.19, 10.12, 10.13, 10.13, 10.22, 10.07, 10.0, 10.08, 10.09, 10.02, 9.73, 10.0, 9.79, 10.0, 9.6, 10.06, 10.07, 10.0, 10.0, 7.53, 10.0], ["#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4", "#ff7f0e", "#ff7f0e", "#ff7f0e", "#ff7f0e", "#ff7f0e", "#ff7f0e", "#ff7f0e"]);
</script>
</body>
</html>
