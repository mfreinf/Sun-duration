name: Update Sonnenvergleich
on:
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: HTML erzeugen
        run: |
          mkdir -p _site
          python3 generate.py
          cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
