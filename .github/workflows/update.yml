name: Update Sonnenvergleich
on:
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: HTML erzeugen
        run: python3 generate.py
      - name: Auf gh-pages speichern
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          python3 generate.py
          git add index.html
          git commit -m "Update"
          git push -f origin gh-pages
